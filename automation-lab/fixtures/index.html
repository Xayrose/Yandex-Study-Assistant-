<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Automation Lab — Synthetic Tasks</title>
<style>body{font:16px system-ui;max-width:900px;margin:3rem auto;padding:0 1rem}section{border:1px solid #ddd;border-radius:12px;padding:1rem;margin:1rem 0}label{display:block;margin:.5rem 0}button{padding:.6rem 1rem} .blocks{display:flex;gap:1rem}.block{border:1px solid #aaa;padding:1rem;border-radius:8px}</style></head>
<body><h1>Automation Lab: Synthetic Interface</h1><p>Dummy exercises for interface auditing. No grades, accounts, or submissions.</p>
<section><h2>Text input mock</h2><label>Sample response<input placeholder="Dummy input" aria-label="Mock text answer"></label></section>
<section><h2>Choice mock</h2><label><input type="radio" name="demo" value="a"> Option A</label><label><input type="radio" name="demo" value="b"> Option B</label></section>
<section><h2>Category mock</h2><select aria-label="Mock category"><option>Category 1</option><option>Category 2</option></select></section>
<section><h2>Drag mock (inventory only)</h2><div class="blocks"><div class="block" draggable="true">Dummy draggable</div><div class="block">Dummy drop area</div></div></section>
<section><h2>Canvas mock</h2><canvas width="300" height="100" aria-label="Mock canvas" style="border:1px solid"></canvas></section>
<section><button type="button">Dummy continue button</button></section>
</body></html>
